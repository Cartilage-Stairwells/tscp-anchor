[package]
name = "tscp-verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
oracle-layer = { path = "../oracle-layer" }
p3-baby-bear = { workspace = true }
p3-field = { workspace = true }

[dev-dependencies]
jsonschema = "0.17"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "evidence_baseline"
harness = false
